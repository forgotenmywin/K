name: Linux Remote Terminal

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Batch ID for logs'
        required: false
        type: string
        default: '1'

jobs:
  runner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl

      - name: Install cloudflared
        run: |
          curl -L \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared

          cloudflared --version

      - name: Generate API token
        run: |
          TOKEN=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo
          echo "=========================================="
          echo "                 API TOKEN"
          echo "=========================================="
          echo "$TOKEN"
          echo "=========================================="
          echo

      - name: Create PTY API
        run: |
          cat > /tmp/server.py <<'PY'
          import os
          import json
          import time
          import select
          import threading
          import pty
          import re
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          TOKEN = os.environ["API_TOKEN"]

          pid, fd = pty.fork()
          if pid == 0:
              os.execvp("bash", ["bash", "--noprofile", "--norc", "-i"])

          PROMPT = "__REMOTE_PTY_READY_7F31__"
          os.write(fd, (f"export PS1='{PROMPT}'; export PS2=''; export TERM=xterm-256color\n").encode())
          time.sleep(0.5)

          try:
              while True:
                  ready, _, _ = select.select([fd], [], [], 0)
                  if not ready: break
                  os.read(fd, 65536)
          except OSError:
              pass

          lock = threading.Lock()

          def read_until_prompt(timeout=300):
              data = b""
              end_time = time.time() + timeout
              while time.time() < end_time:
                  remaining = end_time - time.time()
                  readable, _, _ = select.select([fd], [], [], min(1.0, max(0.1, remaining)))
                  if not readable: continue
                  try:
                      chunk = os.read(fd, 65536)
                  except OSError:
                      break
                  if not chunk: break
                  data += chunk
                  if PROMPT.encode() in data:
                      break
              return data

          def clean_output(data):
              text = data.decode("utf-8", errors="replace")
              return text.replace(PROMPT, "")

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  print("[HTTP]", format % args, flush=True)

              def send_json(self, status, data):
                  body = json.dumps(data, ensure_ascii=False).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/":
                      self.send_json(200, {"status": "online", "type": "real-pty", "shell": "bash", "endpoint": "/command"})
                      return
                  self.send_json(404, {"error": "not found"})

              def do_POST(self):
                  if self.path != "/command":
                      self.send_json(404, {"error": "not found"})
                      return
                  auth = self.headers.get("Authorization", "")
                  if auth != f"Bearer {TOKEN}":
                      self.send_json(401, {"error": "unauthorized"})
                      return
                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                      body = self.rfile.read(length)
                      request = json.loads(body)
                      command = request.get("command")
                      if not command:
                          self.send_json(400, {"error": "command is required"})
                          return
                      print("[PTY COMMAND]", command, flush=True)
                      with lock:
                          os.write(fd, command.encode("utf-8"))
                          os.write(fd, b"\n")
                          output = read_until_prompt(timeout=300)
                      output = clean_output(output)
                      print("[PTY OUTPUT]", output, flush=True)
                      self.send_json(200, {"success": True, "command": command, "stdout": output})
                  except Exception as e:
                      print("[ERROR]", str(e), flush=True)
                      self.send_json(500, {"success": False, "error": str(e)})

          server = ThreadingHTTPServer(("127.0.0.1", 8080), Handler)
          print("REAL PTY TERMINAL API STARTED")
          print("Shell: bash -i")
          print("PTY: REAL")
          print("Listening: 127.0.0.1:8080")
          server.serve_forever()
          PY

      - name: Start PTY API
        run: |
          nohup python3 /tmp/server.py > /tmp/api.log 2>&1 &
          sleep 3
          echo "PTY API started:"
          cat /tmp/api.log

      - name: Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --url http://127.0.0.1:8080 > /tmp/cloudflared.log 2>&1 &
          echo "Waiting for Cloudflare..."
          sleep 10
          URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
          if [ -z "$URL" ]; then
            echo "ERROR: Could not extract URL from cloudflared log"
            cat /tmp/cloudflared.log
            exit 1
          fi
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo
          echo "=========================================="
          echo "          REAL PTY TERMINAL ONLINE"
          echo "=========================================="
          echo "URL: $URL"
          echo "API: $URL/command"
          echo "TOKEN: $API_TOKEN"
          echo
          echo "TEST:"
          echo "curl -X POST \"$URL/command\" \\"
          echo "  -H \"Authorization: Bearer $API_TOKEN\" \\"
          echo "  -H \"Content-Type: application/json\" \\"
          echo "  -d '{\"command\":\"whoami && id\"}'"
          echo "=========================================="

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Send logs to repo
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BATCH_ID: ${{ github.event.inputs.batch_id }}
        run: |
          # 🔥 نام فایل بر اساس run_id و batch_id
          LOG_FILE="logs/run-${RUN_ID}-batch-${BATCH_ID}.txt"
          mkdir -p logs

          echo "Collecting logs into ${LOG_FILE} ..."
          cat > "${LOG_FILE}" <<EOF
          ==========================================
          Run ID        : ${RUN_ID}
          Batch ID      : ${BATCH_ID}
          Run Number    : ${RUN_NUMBER}
          Run Attempt   : ${RUN_ATTEMPT}
          Repository    : ${{ github.repository }}
          Actor         : ${{ github.actor }}
          Branch        : ${{ github.ref_name }}
          Commit        : ${{ github.sha }}
          Collected at  : $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          ==========================================

          --- API log (/tmp/api.log) ---
          $(cat /tmp/api.log 2>/dev/null || echo "File not found")

          --- Cloudflared log (/tmp/cloudflared.log) ---
          $(cat /tmp/cloudflared.log 2>/dev/null || echo "File not found")

          --- Environment Variables ---
          API_TOKEN=${API_TOKEN}
          REMOTE_URL=${URL}

          ==========================================
          End of logs
          ==========================================
          EOF

          echo "${LOG_FILE} created:"
          cat "${LOG_FILE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          git add "${LOG_FILE}"
          if git diff --staged --quiet; then
            echo "No changes to commit (file unchanged)"
          else
            git commit -m "Add logs for run ${RUN_ID} batch ${BATCH_ID} [skip ci]"
            git push
            echo "${LOG_FILE} committed and pushed."
          fi

          echo "Setting repository variables..."
          gh variable set REMOTE_URL --body "$URL" --repo "${{ github.repository }}"
          gh variable set API_TOKEN --body "$API_TOKEN" --repo "${{ github.repository }}"
          echo "Repository variables updated."

      - name: Keep runner alive
        run: |
          echo
          echo "=========================================="
          echo "REAL PTY RUNNER READY"
          echo "Waiting for commands..."
          echo "=========================================="
          while true; do sleep 60; done
