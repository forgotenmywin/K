name: Linux Remote Terminal

on:
  workflow_dispatch:

jobs:
  runner:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # برای commit کردن فایل
      actions: write       # برای تنظیم متغیرهای مخزن

    steps:
      # ... (مراحل قبلی مانند نصب، توکن، سرور و تونل بدون تغییر) ...

      - name: Send logs to repo
        # قبل از این مرحله، مخزن را کلون می‌کنیم
        uses: actions/checkout@v4
        with:
          # برای push کردن نیاز به توکن داریم (به‌طور خودکار GITHUB_TOKEN استفاده می‌شود)
          persist-credentials: true

      - name: Send logs to repo (continue)
        run: |
          echo "Collecting logs into logs.txt ..."

          # ایجاد فایل logs.txt با تمام لاگ‌ها و متغیرها
          cat > logs.txt <<EOF
          ==========================================
          Logs collected at $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          ==========================================

          --- API log (/tmp/api.log) ---
          $(cat /tmp/api.log 2>/dev/null || echo "File not found")

          --- Cloudflared log (/tmp/cloudflared.log) ---
          $(cat /tmp/cloudflared.log 2>/dev/null || echo "File not found")

          --- Environment Variables ---
          API_TOKEN=$API_TOKEN
          REMOTE_URL=$URL

          ==========================================
          End of logs
          ==========================================
          EOF

          echo "logs.txt created:"
          cat logs.txt

          # تنظیم Git (اگر قبلاً تنظیم نشده باشد)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # تنظیم remote با استفاده از GITHUB_TOKEN (اختیاری، ولی مطمئن‌تر است)
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # افزودن فایل و commit
          git add logs.txt
          if git diff --staged --quiet; then
            echo "No changes to commit (logs.txt unchanged)"
          else
            git commit -m "Update logs.txt [skip ci]"
            git push
            echo "logs.txt committed and pushed."
          fi

          # تنظیم متغیرهای مخزن (Repository Variables) با استفاده از gh
          echo "Setting repository variables..."
          gh variable set REMOTE_URL --body "$URL" --repo "${{ github.repository }}"
          gh variable set API_TOKEN --body "$API_TOKEN" --repo "${{ github.repository }}"

          echo "Repository variables updated."

      - name: Keep runner alive
        run: |
          echo
          echo "=========================================="
          echo "REAL PTY RUNNER READY"
          echo "Waiting for commands..."
          echo "=========================================="

          while true
          do
            sleep 60
          done
