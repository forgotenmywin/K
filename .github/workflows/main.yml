name: Linux Web Terminal

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl

      - name: Install cloudflared
        run: |
          curl -L \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

          cloudflared --version

      - name: Create API
        run: |
          cat > /tmp/server.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          import subprocess
          import os

          TOKEN = os.environ["API_TOKEN"]

          class Handler(BaseHTTPRequestHandler):

              def send_json(self, status, data):
                  body = json.dumps(data).encode()

                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()

                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/":
                      self.send_json(200, {
                          "status": "online",
                          "api": "/command"
                      })
                  else:
                      self.send_json(404, {
                          "error": "not found"
                      })

              def do_POST(self):
                  if self.path != "/command":
                      self.send_json(404, {
                          "error": "not found"
                      })
                      return

                  auth = self.headers.get("Authorization", "")

                  if auth != f"Bearer {TOKEN}":
                      self.send_json(401, {
                          "error": "unauthorized"
                      })
                      return

                  try:
                      length = int(
                          self.headers.get("Content-Length", "0")
                      )

                      body = self.rfile.read(length)
                      data = json.loads(body)

                      command = data.get("command")

                      if not command:
                          self.send_json(400, {
                              "error": "command is required"
                          })
                          return

                      result = subprocess.run(
                          command,
                          shell=True,
                          capture_output=True,
                          text=True,
                          timeout=60
                      )

                      self.send_json(200, {
                          "returncode": result.returncode,
                          "stdout": result.stdout,
                          "stderr": result.stderr
                      })

                  except subprocess.TimeoutExpired:
                      self.send_json(408, {
                          "error": "command timeout"
                      })

                  except Exception as e:
                      self.send_json(500, {
                          "error": str(e)
                      })

          server = HTTPServer(
              ("127.0.0.1", 8080),
              Handler
          )

          print("API started on 127.0.0.1:8080", flush=True)

          server.serve_forever()
          PY

      - name: Start API
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          nohup python3 /tmp/server.py > /tmp/api.log 2>&1 &

          sleep 2

          echo "========== API SERVER =========="
          cat /tmp/api.log
          echo "==============================="

      - name: Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel \
            --url http://127.0.0.1:8080 \
            > /tmp/cloudflared.log 2>&1 &

          sleep 8

          URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' \
            /tmp/cloudflared.log | head -1)

          echo
          echo "=========================================="
          echo "           RUNNER API ONLINE"
          echo "=========================================="
          echo
          echo "BASE URL:"
          echo "$URL"
          echo
          echo "API:"
          echo "$URL/command"
          echo
          echo "TEST:"
          echo "$URL/"
          echo
          echo "=========================================="

      - name: Keep runner alive
        run: |
          echo "Runner is ready."
          echo "Waiting for commands..."

          while true; do
            sleep 60
          done
